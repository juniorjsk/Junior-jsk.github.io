<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="JUNIOR SAVY, ton assistant de lecture vocale.">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-512.png">
<meta property="og:title" content="ASSISTANT JUNIOR">
<meta property="og:description" content="Ton assistant de lecture vocale. Écoute tous tes textes à voix haute, même hors ligne.">
<meta property="og:image" content="https://juniorjsk.github.io/Junior-jsk.github.io/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:type" content="website">
<title>ASSISTANT JUNIOR</title>

<style>
* { box-sizing: border-box; }
body {
    margin: 0; padding: 15px; background: #0b1220; color: white;
    font-family: Arial, sans-serif; color-scheme: dark;
}
.container { max-width: 650px; margin: auto; position: relative; }

/* BOUTON INSTALLER */
.install-container { text-align: center; margin-bottom: 15px; display: none; }
.install-btn {
    background: linear-gradient(145deg, #7c3aed, #5b21b6);
    color: white; padding: 12px 20px; border: none; border-radius: 12px;
    font-weight: bold; font-size: 15px; cursor: pointer;
    box-shadow: 0 4px 14px rgba(124, 58, 237, 0.4);
    display: inline-flex; align-items: center; gap: 8px;
    animation: pulse-purple 2s infinite;
}
.install-btn:active { transform: scale(0.95); }
@keyframes pulse-purple {
    0% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(124, 58, 237, 0); }
    100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); }
}

/* HEADER */
header { text-align: center; padding: 10px 0 20px; position: relative; }
.focus-btn { position: absolute; top: 15px; right: 0; background: transparent; border: none; color: #9ca3af; cursor: pointer; }
.focus-btn svg { width: 24px; height: 24px; }
.assistant-avatar {
    position: relative; width: 60px; height: 60px; margin: 0 auto 10px;
    background: #172337; border: 2px solid #7c3aed; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 26px;
    box-shadow: 0 0 15px rgba(124, 58, 237, 0.4);
}
.assistant-avatar::after { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid #22c55e; opacity: 0; animation: none; }
.assistant-avatar.speaking::after { animation: pulse 2s infinite; }
@keyframes pulse { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(1.35); opacity: 0; } }
h1 { color: #22c55e; margin: 8px 0; font-size: 28px; }
header p { color: #9ca3af; margin: 0; font-size: 14px; }

/* PANNEAU RÉGLAGES */
.panel { background: #172337; padding: 16px; border-radius: 16px; margin-bottom: 15px; border: 1px solid #293951; transition: all 0.3s ease; }
.panel.hidden { display: none; }
label { display: block; margin: 12px 0 6px; color: #cbd5e1; font-size: 14px; }
select, input { width: 100%; padding: 12px; background: #0b1220; border: 1px solid #37465e; border-radius: 10px; color: white; font-size: 15px; font-family: inherit; }
input[type="range"] { padding: 5px 0; accent-color: #22c55e; }

/* BARRE D'OUTILS TEXTE */
.text-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 5px; }
.text-toolbar-label { color: #cbd5e1; font-size: 14px; }
.toolbar-actions { display: flex; gap: 6px; }
.tool-btn { background: #1e2a3d; border: 1px solid #37465e; color: #cbd5e1; padding: 6px 10px; border-radius: 8px; font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer; }
.tool-btn:hover { background: #293951; }
.tool-btn svg { width: 14px; height: 14px; }

/* ZONE TEXTE AVEC EFFET NÉON */
.textarea-wrap { 
    position: relative; 
    background: #0b1220; 
    border: 2px solid #7c3aed;
    border-radius: 16px;
    box-shadow: 0 0 15px rgba(124, 58, 237, 0.4), inset 0 0 10px rgba(124, 58, 237, 0.1);
    transition: all .2s ease; 
}
.textarea-wrap:focus-within { 
    border-color: #a78bfa;
    box-shadow: 0 0 20px rgba(124, 58, 237, 0.7), inset 0 0 15px rgba(124, 58, 237, 0.2); 
}
.textarea-wrap textarea { position: relative; z-index: 2; display: block; width: 100%; min-height: 250px; padding: 16px; border: none; border-radius: 14px; background: transparent; color: #fff; font-family: inherit; font-size: 15px; line-height: 1.5; resize: vertical; outline: none; scrollbar-width: none; }
.textarea-wrap textarea::-webkit-scrollbar { display: none; }
.highlight-layer { position: absolute; inset: 0; z-index: 1; padding: 16px; color: transparent; white-space: pre-wrap; word-wrap: break-word; word-break: break-word; overflow-y: auto; pointer-events: none; font-family: inherit; font-size: 15px; line-height: 1.5; scrollbar-width: none; }
.highlight-layer::-webkit-scrollbar { display: none; }
.highlight-layer mark { background: #22c55e; color: transparent; padding: 0; margin: 0; border-radius: 3px; }

/* LECTEUR AUDIO - BORDURE DÉGRADÉE (CHOIX 2) */
.player-container { 
    display: flex; flex-direction: column; gap: 15px; margin-top: 15px; padding: 15px; 
    /* La magie du bord dégradé ici */
    border: 2px solid transparent;
    background: linear-gradient(#0b1220, #0b1220) padding-box, 
                linear-gradient(90deg, #7c3aed, #22c55e, #3b82f6, #ef4444) border-box;
    border-radius: 20px; 
}

.row-play { display: flex; align-items: center; gap: 10px; background: #0b1220; border: 1px solid #293951; border-radius: 999px; padding: 6px 10px; width: 100%; }
.player-main { flex: 1 1 auto; min-width: 0; width: 100%; }
.progress { position: relative; height: 32px; display: flex; align-items: center; cursor: pointer; touch-action: none; width: 100%; }
.progress-track { position: relative; width: 100%; height: 8px; background: #293951; border-radius: 999px; overflow: hidden; }
.progress-fill { position: absolute; top: 0; bottom: 0; left: 0; width: 0%; background: linear-gradient(90deg, #7c3aed, #22c55e); border-radius: 999px; }
.progress-knob { position: absolute; top: 50%; left: 0%; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 0 10px #22c55e, 0 0 0 3px rgba(34, 197, 94, .25); transform: translate(-50%, -50%); pointer-events: none; opacity: 0; transition: opacity .15s ease; }
.progress:hover .progress-knob, .progress.dragging .progress-knob { opacity: 1; }
.time { display: flex; justify-content: space-between; font-size: 11px; color: #8aa0bd; font-variant-numeric: tabular-nums; margin-top: 4px; padding: 0 2px; }

/* ---------- BOUTONS EFFET VERRE/NÉON (GEMINI) ---------- */
.row-actions {
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 5px 0;
}

.btn-neon {
    --c: #a855f7;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 2px solid var(--c);
    background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, 0.15), rgba(23, 35, 55, 0.85) 65%);
    box-shadow: 0 0 12px var(--c), inset 0 0 8px var(--c);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.15s ease;
}

.btn-neon:active { transform: scale(0.92); }

.btn-neon svg {
    width: 26px;
    height: 26px;
    fill: none;
    stroke: var(--c);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.btn-neon.purple { --c: #a855f7; }
.btn-neon.green { --c: #22c55e; }
.btn-neon.blue { --c: #38bdf8; }
.btn-neon.red { --c: #ef4444; }

/* Animation uniquement quand le micro enregistre */
.btn-neon.green.recording {
    --c: #ef4444;
    box-shadow: 0 0 15px rgba(239, 68, 68, 0.8), inset 0 0 10px rgba(239, 68, 68, 0.4);
    animation: pulse-mic 1.5s infinite;
}

@keyframes pulse-mic {
    0% { box-shadow: 0 0 12px rgba(239, 68, 68, 0.6), inset 0 0 8px rgba(239, 68, 68, 0.3); }
    50% { box-shadow: 0 0 20px rgba(239, 68, 68, 0.9), inset 0 0 12px rgba(239, 68, 68, 0.5); }
    100% { box-shadow: 0 0 12px rgba(239, 68, 68, 0.6), inset 0 0 8px rgba(239, 68, 68, 0.3); }
}

/* Gestion Play/Pause (couleur de l'icône) */
.btn-neon.purple .icon-pause { display: none; }
.btn-neon.purple.playing .icon-play { display: none; }
.btn-neon.purple.playing .icon-pause { display: block; }

/* MODALES */
.modal-overlay { position: fixed; inset: 0; background: rgba(11, 18, 32, 0.9); display: none; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(3px); }
.modal-overlay.active { display: flex; }
.modal-content { background: #172337; border: 1px solid #293951; border-radius: 16px; width: 90%; max-width: 500px; padding: 20px; max-height: 80vh; display: flex; flex-direction: column; }
.modal-content h2 { margin-top: 0; color: #22c55e; font-size: 20px; text-align: center; }
.library-list { flex-grow: 1; overflow-y: auto; margin-bottom: 15px; display: flex; flex-direction: column; gap: 10px; }
.lib-item { background: #0b1220; border: 1px solid #293951; padding: 12px; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
.lib-item-text { flex-grow: 1; cursor: pointer; }
.lib-item-title { font-weight: bold; color: #fff; margin-bottom: 4px; display: block; }
.lib-item-date { font-size: 11px; color: #8aa0bd; }
.lib-item-delete { background: transparent; border: none; color: #ef4444; cursor: pointer; font-size: 18px; padding: 5px; }
.modal-close { background: #293951; border: none; color: white; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; width: 100%; }

/* MODALE PAUSE */
.pause-modal { background: #172337; border: 1px solid #7c3aed; border-radius: 16px; padding: 20px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 0 20px rgba(124, 58, 237, 0.2); }
.pause-modal h3 { margin: 0 0 10px; color: #22c55e; font-size: 20px; }
.pause-modal p { margin: 0 0 20px; font-size: 14px; color: #cbd5e1; line-height: 1.4; }
.pause-actions { display: flex; gap: 10px; justify-content: center; }
.pause-actions button { padding: 12px 20px; border-radius: 10px; border: none; font-weight: bold; font-size: 14px; cursor: pointer; }
.btn-continue { background: #7c3aed; color: white; }
.btn-rest { background: #1e2a3d; color: white; border: 1px solid #37465e !important; }

.status { color: #4ade80; text-align: center; font-size: 13px; margin-top: 12px; }
footer { text-align: center; color: #64748b; padding: 15px; font-size: 12px; }

/* MODE PLEIN ÉCRAN POUR LE TEXTE */
body.fullscreen-mode header,
body.fullscreen-mode #installContainer,
body.fullscreen-mode #settingsPanel,
body.fullscreen-mode .player-container,
body.fullscreen-mode footer,
body.fullscreen-mode .toolbar-actions .tool-btn:not(#expandBtn),
body.fullscreen-mode .text-toolbar-label {
    display: none !important;
}
body.fullscreen-mode .text-toolbar {
    position: fixed; top: 10px; right: 10px; z-index: 1002; margin: 0;
}
body.fullscreen-mode .textarea-wrap {
    position: fixed; top: 10px; left: 10px; right: 10px; bottom: 10px;
    z-index: 1001; min-height: auto;
}
body.fullscreen-mode .textarea-wrap textarea,
body.fullscreen-mode .highlight-layer {
    height: 100%; resize: none;
}
body.fullscreen-mode #expandBtn {
    background: #dc2626; color: white; border: none;
    width: 40px; height: 40px; font-size: 20px; padding: 0; border-radius: 50%;
    display: grid; place-items: center; box-shadow: 0 4px 14px rgba(220, 38, 38, .35);
}

@media (max-width: 380px) {
    h1 { font-size: 24px; }
    .btn-neon { width: 50px; height: 50px; }
    .btn-neon svg { width: 22px; height: 22px; }
}
</style>
</head>

<body>

<div class="container">

<header>
    <button class="focus-btn" id="focusBtn" aria-label="Mode Focus">
        <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
        <svg id="eyeClosed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
    </button>
    <div class="assistant-avatar" id="avatar" title="JUNIOR SAVY">🎙️</div>
    <h1>JUNIOR SAVY</h1>
    <p id="subtitle">Ton assistant de lecture vocale</p>
</header>

<div class="install-container" id="installContainer">
    <button class="install-btn" id="installBtn">📲 Installer l'application</button>
</div>

<div class="panel" id="settingsPanel">
    <label id="languageLabel" for="language">Langue</label>
    <select id="language">
        <option value="fr">Français</option>
        <option value="en">English</option>
    </select>

    <label id="voiceLabel" for="voice">Voix disponible</label>
    <select id="voice"></select>

    <label id="timerLabel" for="pauseTimer">Minuteur de pause</label>
    <select id="pauseTimer">
        <option value="0">Désactivé</option>
        <option value="1">Toutes les 1 minute</option>
        <option value="2">Toutes les 2 minutes</option>
        <option value="5">Toutes les 5 minutes</option>
        <option value="10">Toutes les 10 minutes</option>
    </select>

    <label for="speed"><span id="speedLabel">Vitesse : </span><span id="speedValue">1.0</span></label>
    <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">

    <label for="pitch"><span id="pitchLabel">Tonalité : </span><span id="pitchValue">1.0</span></label>
    <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">
</div>

<div class="panel">
    <div class="text-toolbar">
        <span class="text-toolbar-label" id="textLabel">Écris ou colle ton texte :</span>
        <div class="toolbar-actions">
            <button class="tool-btn" id="saveBtn" title="Sauvegarder ce cours">💾 Sauver</button>
            <button class="tool-btn" id="importBtn" title="Importer un fichier .txt">📥 Importer</button>
            <button class="tool-btn" id="libraryBtn" title="Voir mes cours">📂 Cours</button>
            <button class="tool-btn" id="shareAppBtn" title="Partager l'application">📤 Partager</button>
            <button class="tool-btn" id="expandBtn" title="Agrandir la zone de texte">⛶</button>
        </div>
    </div>
    
    <input type="file" id="fileInput" accept=".txt" style="display:none">

    <div class="textarea-wrap">
        <div class="highlight-layer" id="highlightLayer" aria-hidden="true"></div>
        <textarea id="textInput" maxlength="20000" placeholder="Tape ton texte...">Bienvenue sur JUNIOR SAVY ! 🎙️ Je suis ton assistant. Écris ou colle ton cours ci-dessous, puis clique sur ▶️ pour que je te le lise à voix haute (même sans internet). Tu peux aussi me parler en cliquant sur le micro 🎤. Bon courage pour tes révisions !</textarea>
    </div>

    <div class="player-container">
        <div class="row-play">
            <button class="btn-neon purple" id="playBtn" type="button" aria-label="Lire">
                <svg class="icon-play" viewBox="0 0 24 24"><polygon points="8,5 19,12 8,19" /></svg>
                <svg class="icon-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
            </button>
            <div class="player-main">
                <div class="progress" id="progressBar" role="slider" tabindex="0" aria-label="Progression">
                    <div class="progress-track">
                        <div class="progress-fill" id="progressFill"></div>
                        <div class="progress-knob" id="progressKnob"></div>
                    </div>
                </div>
                <div class="time">
                    <span id="timeCurrent">0:00</span>
                    <span id="timeTotal">0:00</span>
                </div>
            </div>
        </div>

        <div class="row-actions">
            <button class="btn-neon green" id="dictateBtn" type="button" aria-label="Dicter">
                <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z" /></svg>
            </button>
            <button class="btn-neon blue" id="translateBtn" type="button" aria-label="Traduire">
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M3.6 9h16.8M3.6 15h16.8M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" /></svg>
            </button>
            <button class="btn-neon red" id="clearBtn" type="button" aria-label="Effacer">
                <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2m-9 0l1 14h8l1-14" /></svg>
            </button>
        </div>
    </div>
    <div class="status" id="status" role="status" aria-live="polite">● Prêt</div>
</div>

<footer>
    ASSISTANT JUNIOR © 2026<br>Assistant personnel
</footer>
</div>

<!-- MODALES -->
<div class="modal-overlay" id="libraryModal">
    <div class="modal-content">
        <h2>📂 Mes cours sauvegardés</h2>
        <div class="library-list" id="libraryList"></div>
        <button class="modal-close" id="closeLibraryBtn">Fermer</button>
    </div>
</div>

<div class="modal-overlay" id="pauseModal">
    <div class="pause-modal">
        <h3>☕ C'est l'heure de la pause !</h3>
        <p>Cher collègue, le moment est venu de souffler un peu. Veux-tu faire une pause ou continuer ?</p>
        <div class="pause-actions">
            <button class="btn-rest" id="btnRest">Faire une pause</button>
            <button class="btn-continue" id="btnContinue">Continuer</button>
        </div>
    </div>
</div>

<script>
/* ============================================================
   INSTALLATION DE L'APPLICATION (PWA)
   ============================================================ */
let deferredPrompt;
const installContainer = document.getElementById('installContainer');
const installBtn = document.getElementById('installBtn');

const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;

if (!isStandalone) {
    window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        installContainer.style.display = 'block';
    });
}

installBtn.addEventListener('click', async () => {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') installContainer.style.display = 'none';
        deferredPrompt = null;
    }
});

window.addEventListener('appinstalled', () => { installContainer.style.display = 'none'; });

/* ============================================================
   ÉTAT GLOBAL
   ============================================================ */
let voices = [], chunks = [], chunkStarts = [], totalChars = 0;
let chunkIndex = 0, chunkOffset = 0, lastBoundary = 0, session = 0;
let isReading = false, isPaused = false, preparedText = "", estDuration = 0;
let chunkStartTs = 0, rafId = 0, progress = 0, lastCurText = "", lastTotText = "";
let wakeLock = null, highlightStart = -1, highlightEnd = -1;

// Minuteur (Corrigé)
let timerInterval = null;
let timerStartTime = 0;
let timerPausedTime = 0;
let timerTargetDuration = 0;
let isPauseModalActive = false;

// Dictée
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, isDictating = false, dictationBase = "", dictationFinal = "", silenceTimer = null;

const $ = id => document.getElementById(id);
const bar = $("progressBar"), playBtn = $("playBtn"), dictateBtn = $("dictateBtn");
const avatar = $("avatar"), highlightLayer = $("highlightLayer"), textarea = $("textInput");

/* ============================================================
   WAKE LOCK
   ============================================================ */
async function requestWakeLock() { try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {} }
function releaseWakeLock() { if (wakeLock !== null) { wakeLock.release().then(() => { wakeLock = null; }); wakeLock = null; } }
document.addEventListener('visibilitychange', async () => { if (wakeLock !== null && document.visibilityState === 'visible') await requestWakeLock(); });

/* ============================================================
   PARTAGE DE L'APPLICATION
   ============================================================ */
$("shareAppBtn").addEventListener("click", async () => {
    const shareData = {
        title: 'ASSISTANT JUNIOR',
        text: 'Découvre ASSISTANT JUNIOR, l\'application gratuite pour lire et dicter tes cours !',
        url: 'https://juniorjsk.github.io/Junior-jsk.github.io/'
    };
    try {
        if (navigator.share) { await navigator.share(shareData); }
        else { await navigator.clipboard.writeText(shareData.url); alert("Lien copié !"); }
    } catch (err) { console.log("Partage annulé"); }
});

/* ============================================================
   MODE PLEIN ÉCRAN POUR LE TEXTE
   ============================================================ */
$("expandBtn").addEventListener("click", () => {
    const isFullscreen = document.body.classList.toggle("fullscreen-mode");
    $("expandBtn").textContent = isFullscreen ? "✖" : "⛶";
});

/* ============================================================
   MINUTEUR DE PAUSE (CORRIGÉ)
   ============================================================ */
function startPauseTimer(reset = false) {
    clearInterval(timerInterval);
    const pauseMin = parseInt($("pauseTimer").value);
    
    if (pauseMin > 0) {
        timerTargetDuration = pauseMin * 60 * 1000; // en millisecondes
        
        if (reset) {
            timerPausedTime = 0;
            timerStartTime = Date.now();
        } else {
            timerStartTime = Date.now();
        }

        timerInterval = setInterval(() => {
            if (!isReading || isPaused || isPauseModalActive) return;
            
            const elapsed = timerPausedTime + (Date.now() - timerStartTime);
            
            if (elapsed >= timerTargetDuration) {
                triggerPauseModal();
            }
        }, 1000);
    }
}

function triggerPauseModal() {
    pauseReading();
    isPauseModalActive = true;
    $("pauseModal").classList.add("active");
    speechSynthesis.cancel();
    const utt = new SpeechSynthesisUtterance("Cher collègue, c'est l'heure de la pause ! Veux-tu faire une pause ou continuer ?");
    utt.lang = language() === "fr" ? "fr-FR" : "en-US";
    const voice = voices.find(v => v.voiceURI === $("voice").value);
    if (voice) utt.voice = voice;
    speechSynthesis.speak(utt);
}

$("btnContinue").addEventListener("click", () => {
    isPauseModalActive = false;
    $("pauseModal").classList.remove("active");
    // Remise à zéro du chrono et relance
    timerPausedTime = 0;
    timerStartTime = Date.now();
    startPauseTimer(false);
    resumeReading();
});

$("btnRest").addEventListener("click", () => {
    isPauseModalActive = false;
    $("pauseModal").classList.remove("active");
    // On gèle le temps actuel
    if (timerInterval) {
        timerPausedTime += (Date.now() - timerStartTime);
        clearInterval(timerInterval);
        timerInterval = null;
    }
    $("status").textContent = "● En pause...";
});

/* ============================================================
   SAUVEGARDE AUTO & BIBLIOTHÈQUE
   ============================================================ */
let library = JSON.parse(localStorage.getItem('junior_savvy_library') || '[]');
function autoSave() {
    if (textarea.value !== "Bienvenue sur JUNIOR SAVY ! 🎙️ Je suis ton assistant. Écris ou colle ton cours ci-dessous, puis clique sur ▶️ pour que je te le lise à voix haute (même sans internet). Tu peux aussi me parler en cliquant sur le micro 🎤. Bon courage pour tes révisions !") {
        localStorage.setItem('junior_savvy_autosave', textarea.value);
    }
}
function loadAutoSave() {
    const saved = localStorage.getItem('junior_savvy_autosave');
    if (saved && saved.trim().length > 0) { textarea.value = saved; hasClearedWelcome = true; }
}
$("saveBtn").addEventListener("click", () => {
    const text = textarea.value.trim();
    if (!text) { alert("Le texte est vide !"); return; }
    const title = prompt("Donne un nom à ce cours (ex: Histoire - Chapitre 1) :");
    if (title) {
        library.unshift({ title, text, date: new Date().toLocaleDateString() });
        localStorage.setItem('junior_savvy_library', JSON.stringify(library));
        alert("Cours sauvegardé dans ta bibliothèque ! ✅");
    }
});
$("libraryBtn").addEventListener("click", () => {
    const list = $("libraryList");
    list.innerHTML = "";
    if (library.length === 0) {
        list.innerHTML = "<p style='text-align:center; color:#8aa0bd;'>Aucun cours sauvegardé pour le moment.</p>";
    } else {
        library.forEach((item, index) => {
            const div = document.createElement("div");
            div.className = "lib-item";
            div.innerHTML = `<div class="lib-item-text" onclick="loadCourse(${index})"><span class="lib-item-title">${item.title}</span><span class="lib-item-date">${item.date}</span></div><button class="lib-item-delete" onclick="deleteCourse(${index})">🗑️</button>`;
            list.appendChild(div);
        });
    }
    $("libraryModal").classList.add("active");
});
$("closeLibraryBtn").addEventListener("click", () => $("libraryModal").classList.remove("active"));
window.loadCourse = (index) => {
    textarea.value = library[index].text; hasClearedWelcome = true;
    $("libraryModal").classList.remove("active");
    prepareText(); setProgress(0); updateUI(); autoSave();
};
window.deleteCourse = (index) => {
    if (confirm("Supprimer ce cours ?")) {
        library.splice(index, 1);
        localStorage.setItem('junior_savvy_library', JSON.stringify(library));
        $("libraryBtn").click();
    }
};

/* ============================================================
   IMPORTATION FICHIER
   ============================================================ */
$("importBtn").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
        textarea.value = event.target.result; hasClearedWelcome = true;
        prepareText(); setProgress(0); updateUI(); autoSave();
        $("status").textContent = "● Fichier importé !";
    };
    reader.readAsText(file); e.target.value = "";
});

/* ============================================================
   MODE FOCUS (Réglages)
   ============================================================ */
$("focusBtn").addEventListener("click", () => {
    const panel = $("settingsPanel");
    const isHidden = panel.classList.toggle("hidden");
    $("eyeOpen").style.display = isHidden ? "none" : "block";
    $("eyeClosed").style.display = isHidden ? "block" : "none";
});

/* ============================================================
   DICTÉE (Renforcée)
   ============================================================ */
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = true;

    recognition.onstart = () => {
        isDictating = true; dictateBtn.classList.add("recording");
        $("status").textContent = "● Micro actif...";
        dictationBase = textarea.value; dictationFinal = "";
        resetSilenceTimer();
    };

    recognition.onresult = (event) => {
        resetSilenceTimer();
        let interim = '';
        for (let i = event.resultIndex; i < event.results.length; ++i) {
            if (event.results[i].isFinal) dictationFinal += event.results[i][0].transcript + ' ';
            else interim += event.results[i][0].transcript;
        }
        const space = (dictationBase.length > 0 && !dictationBase.endsWith(' ')) ? ' ' : '';
        textarea.value = dictationBase + space + dictationFinal + interim;
        textarea.scrollTop = textarea.scrollHeight;
        if (!isReading) { preparedText = ""; setProgress(0); }
        autoSave();
    };

    recognition.onerror = (event) => {
        if (event.error === 'no-speech') return;
        if (event.error === 'not-allowed') alert("Veuillez autoriser le microphone dans les paramètres de votre navigateur.");
        stopDictation();
    };

    recognition.onend = () => {
        if (isDictating) {
            try { recognition.start(); } catch (e) { setTimeout(() => { if (isDictating) recognition.start(); }, 100); }
        } else { stopDictation(); }
    };
}

function resetSilenceTimer() {
    clearTimeout(silenceTimer);
    if (isDictating) {
        silenceTimer = setTimeout(() => {
            if (isDictating) {
                isDictating = false; recognition.stop();
                $("status").textContent = "● Micro arrêté (silence)";
                dictateBtn.classList.remove("recording");
            }
        }, 10000);
    }
}

function toggleDictation() {
    if (!navigator.onLine) { alert("La dictée vocale nécessite une connexion internet."); return; }
    if (!recognition) { alert("Utilisez Chrome pour la dictée."); return; }
    if (isDictating) { isDictating = false; recognition.stop(); }
    else {
        if (isReading) pauseReading();
        recognition.lang = language() === "fr" ? "fr-FR" : "en-US";
        dictationBase = textarea.value; dictationFinal = ""; isDictating = true;
        try { recognition.start(); } catch (e) { setTimeout(() => recognition.start(), 100); }
    }
}

function stopDictation() {
    isDictating = false; dictateBtn.classList.remove("recording");
    clearTimeout(silenceTimer); updateUI();
}

/* ============================================================
   TRADUCTION
   ============================================================ */
$("translateBtn").addEventListener("click", async () => {
    if (!navigator.onLine) { alert("La traduction nécessite internet."); return; }
    if (isDictating) toggleDictation();
    const start = textarea.selectionStart, end = textarea.selectionEnd;
    const hasSelection = start !== end;
    let textToTranslate = hasSelection ? textarea.value.substring(start, end) : textarea.value.trim();
    if (!textToTranslate) { alert("Veuillez écrire du texte."); return; }
    const toEnglish = confirm("Traduire vers l'Anglais ?\n(Annuler = vers le Français)");
    const targetLang = toEnglish ? "en" : "fr";
    $("status").textContent = "● Traduction...";
    $("translateBtn").style.opacity = "0.5"; $("translateBtn").disabled = true;
    try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=${targetLang}&dt=t&q=${encodeURIComponent(textToTranslate)}`);
        const data = await res.json();
        const translatedText = data[0].map(item => item[0]).join('');
        if (hasSelection) textarea.value = textarea.value.substring(0, start) + translatedText + textarea.value.substring(end);
        else { textarea.value = translatedText; hasClearedWelcome = true; }
        prepareText(); setProgress(0); updateUI(); autoSave();
    } catch (err) {
        alert("Erreur de connexion."); updateUI();
    } finally {
        $("translateBtn").style.opacity = "1"; $("translateBtn").disabled = false;
    }
});

/* ============================================================
   LECTURE
   ============================================================ */
const translations = {
    fr: { subtitle: "Ton assistant de lecture vocale", languageLabel: "Langue", voiceLabel: "Voix disponible", timerLabel: "Minuteur de pause", speedLabel: "Vitesse : ", pitchLabel: "Tonalité : ", textLabel: "Écris ou colle ton texte :", play: "Lire", pause: "Pause", resume: "Reprendre", ready: "● Prêt", reading: "● Lecture...", paused: "● En pause", empty: "Entrez du texte.", noVoice: "Aucune voix", speechNotSupported: "Non supporté." },
    en: { subtitle: "Your voice reading assistant", languageLabel: "Language", voiceLabel: "Available voice", timerLabel: "Pause timer", speedLabel: "Speed : ", pitchLabel: "Pitch : ", textLabel: "Type or paste text:", play: "Read", pause: "Pause", resume: "Resume", ready: "● Ready", reading: "● Reading...", paused: "● Paused", empty: "Enter text.", noVoice: "No voice", speechNotSupported: "Not supported." }
};
const language = () => $("language").value;
const t = key => translations[language()][key];

function loadVoices() {
    if (!("speechSynthesis" in window)) return;
    const previous = $("voice").value;
    voices = speechSynthesis.getVoices();
    const filtered = voices.filter(v => v.lang.toLowerCase().startsWith(language()));
    $("voice").innerHTML = "";
    filtered.forEach(v => {
        const opt = document.createElement("option");
        opt.value = v.voiceURI; opt.textContent = v.name + " (" + v.lang + ")"; $("voice").appendChild(opt);
    });
    if (filtered.length === 0) {
        const opt = document.createElement("option");
        opt.value = ""; opt.textContent = t("noVoice"); $("voice").appendChild(opt);
    } else if (previous && filtered.some(v => v.voiceURI === previous)) { $("voice").value = previous; }
}

function splitIntoChunks(text) {
    const clean = text.replace(/\s+/g, " ").trim();
    const sentences = clean.match(/[^.!?…;:]+[.!?…;:]*\s*/g) || [clean];
    const out = []; let buf = "";
    for (const s of sentences) {
        if (buf && (buf.length + s.length) > 140) { out.push(buf); buf = s; }
        else buf += s;
    }
    if (buf.trim()) out.push(buf);
    return out.filter(c => c.trim().length > 0);
}

function estimateDuration(text, rate) {
    const words = text.trim().split(/\s+/).filter(Boolean).length;
    return Math.max(1, (words / 170) * 60 / Math.max(0.5, rate));
}

function prepareText() {
    const text = textarea.value.trim();
    if (!text) return false;
    if (text === preparedText && chunks.length) return true;
    preparedText = text;
    chunks = splitIntoChunks(text);
    chunkStarts = []; let acc = 0;
    for (const c of chunks) { chunkStarts.push(acc); acc += c.length; }
    totalChars = acc;
    chunkIndex = 0; chunkOffset = 0; lastBoundary = 0;
    estDuration = estimateDuration(text, Number($("speed").value));
    return true;
}

function getWordBoundsAt(text, pos) {
    pos = Math.max(0, Math.min(pos, text.length));
    let p = pos;
    while (p < text.length && /\s/.test(text[p])) p++;
    if (p >= text.length) {
        p = text.length;
        while (p > 0 && /\s/.test(text[p - 1])) p--;
        if (p === 0) return { start: 0, end: 0 };
    }
    let start = p; while (start > 0 && !/\s/.test(text[start - 1])) start--;
    let end = p; while (end < text.length && !/\s/.test(text[end])) end++;
    return { start, end };
}

function renderHighlight(absPos) {
    const text = textarea.value;
    if (!text) { clearHighlight(); return; }
    const { start, end } = getWordBoundsAt(text, absPos);
    if (start === highlightStart && end === highlightEnd) return;
    highlightStart = start; highlightEnd = end;
    if (start >= end) { highlightLayer.textContent = ""; return; }
    highlightLayer.textContent = "";
    const before = document.createTextNode(text.slice(0, start));
    const mark = document.createElement("mark"); mark.textContent = text.slice(start, end);
    const after = document.createTextNode(text.slice(end));
    highlightLayer.append(before, mark, after);
    syncScroll();
}

function clearHighlight() {
    if (highlightStart === -1 && highlightEnd === -1) return;
    highlightStart = -1; highlightEnd = -1; highlightLayer.textContent = "";
}

function syncScroll() { highlightLayer.scrollTop = textarea.scrollTop; highlightLayer.scrollLeft = textarea.scrollLeft; }
textarea.addEventListener("scroll", syncScroll);

function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) sec = 0;
    const total = Math.round(sec);
    return Math.floor(total / 60) + ":" + String(total % 60).padStart(2, "0");
}

function setProgress(p) {
    progress = Math.max(0, Math.min(1, p || 0));
    const pct = progress * 100;
    $("progressFill").style.width = pct.toFixed(2) + "%";
    $("progressKnob").style.left = pct.toFixed(2) + "%";
    bar.setAttribute("aria-valuenow", Math.round(pct));
    const curTxt = formatTime(progress * estDuration);
    const totTxt = formatTime(estDuration);
    if (curTxt !== lastCurText) { $("timeCurrent").textContent = curTxt; lastCurText = curTxt; }
    if (totTxt !== lastTotText) { $("timeTotal").textContent = totTxt; lastTotText = totTxt; }
}

function updateUI() {
    const playing = isReading && !isPaused;
    playBtn.classList.toggle("playing", playing);
    playBtn.setAttribute("aria-label", playing ? t("pause") : (isReading && isPaused ? t("resume") : t("play")));
    if (!isDictating && !isPauseModalActive) $("status").textContent = isReading ? (isPaused ? t("paused") : t("reading")) : t("ready");
    avatar.classList.toggle("speaking", playing);
}

function interpolatedChar() {
    if (!totalChars) return 0;
    const estPerChar = estDuration / totalChars;
    if (!estPerChar) return chunkStarts[chunkIndex] + chunkOffset;
    const elapsed = (performance.now() - chunkStartTs) / 1000;
    const len = chunks[chunkIndex] ? chunks[chunkIndex].length : 0;
    return chunkStarts[chunkIndex] + Math.min(len, chunkOffset + elapsed / estPerChar);
}

function startProgressLoop() {
    stopProgressLoop();
    const tick = () => {
        if (!isReading || isPaused) { rafId = 0; return; }
        setProgress(interpolatedChar() / totalChars);
        renderHighlight(interpolatedChar());
        rafId = requestAnimationFrame(tick);
    };
    rafId = requestAnimationFrame(tick);
}

function stopProgressLoop() { if (rafId) cancelAnimationFrame(rafId); rafId = 0; }

function speakChunk(i, token) {
    if (token !== session) return;
    if (i >= chunks.length) { finishReading(); return; }
    chunkIndex = i;
    const piece = chunks[i].slice(chunkOffset).trim();
    if (!piece) { chunkOffset = 0; speakChunk(i + 1, token); return; }
    lastBoundary = chunkOffset;
    chunkStartTs = performance.now();
    renderHighlight(chunkStarts[i] + chunkOffset);
    const utterance = new SpeechSynthesisUtterance(piece);
    const voice = voices.find(v => v.voiceURI === $("voice").value);
    if (voice) utterance.voice = voice;
    utterance.lang = language() === "fr" ? "fr-FR" : "en-US";
    utterance.rate = Number($("speed").value);
    utterance.pitch = Number($("pitch").value);
    const chunkLen = chunks[i].length;
    utterance.onstart = () => { if (token !== session) return; chunkStartTs = performance.now(); startProgressLoop(); };
    utterance.onboundary = (e) => {
        if (token !== session) return;
        const pos = Math.min(chunkOffset + (e.charIndex || 0), chunkLen);
        if (pos <= lastBoundary) return;
        lastBoundary = pos;
        const abs = chunkStarts[i] + pos;
        setProgress(abs / totalChars); renderHighlight(abs);
        const estPerChar = estDuration / totalChars;
        if (estPerChar > 0) chunkStartTs = performance.now() - (pos - chunkOffset) * estPerChar * 1000;
    };
    utterance.onend = () => {
        if (token !== session) return;
        setProgress((chunkStarts[i] + chunkLen) / totalChars);
        chunkOffset = 0; lastBoundary = 0;
        speakChunk(i + 1, token);
    };
    utterance.onerror = (e) => {
        if (token !== session) return;
        if (e.error === "interrupted" || e.error === "canceled") return;
        chunkOffset = 0; speakChunk(i + 1, token);
    };
    speechSynthesis.speak(utterance);
}

function startReading() {
    if (!("speechSynthesis" in window)) { alert(t("speechNotSupported")); return; }
    if (!prepareText()) { alert(t("empty")); return; }
    if (chunkIndex >= chunks.length) { chunkIndex = 0; chunkOffset = 0; }
    if (isDictating) toggleDictation();
    
    session++;
    stopProgressLoop();
    isReading = true; isPaused = false; chunkOffset = 0; lastBoundary = 0;
    estDuration = estimateDuration(preparedText, Number($("speed").value));
    
    const abs = chunkStarts[chunkIndex];
    setProgress(abs / totalChars); renderHighlight(abs); updateUI(); requestWakeLock();
    
    // Reset complet du minuteur au démarrage
    startPauseTimer(true); 

    const token = session; const index = chunkIndex;
    if (speechSynthesis.speaking || speechSynthesis.pending) {
        speechSynthesis.cancel(); setTimeout(() => speakChunk(index, token), 80);
    } else { speakChunk(index, token); }
}

function pauseReading() {
    session++;
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    isPaused = true; stopProgressLoop();
    
    // On gèle le temps
    if (timerInterval) {
        timerPausedTime += (Date.now() - timerStartTime);
        clearInterval(timerInterval);
        timerInterval = null;
    }

    chunkOffset = Math.min(lastBoundary, chunks[chunkIndex] ? chunks[chunkIndex].length : 0);
    lastBoundary = chunkOffset; renderHighlight(chunkStarts[chunkIndex] + chunkOffset);
    updateUI(); releaseWakeLock();
}

function resumeReading() {
    isPaused = false; const token = ++session;
    updateUI(); speakChunk(chunkIndex, token); requestWakeLock();
    
    // Relance le minuteur là où on s'était arrêté
    if (parseInt($("pauseTimer").value) > 0) {
        startPauseTimer(false);
    }
}

function finishReading() {
    stopProgressLoop();
    isReading = false; isPaused = false; chunkIndex = 0; chunkOffset = 0; lastBoundary = 0;
    clearInterval(timerInterval); timerInterval = null; timerPausedTime = 0;
    clearHighlight(); setProgress(0); updateUI(); releaseWakeLock();
}

function togglePlay() {
    if (isReading && !isPaused) pauseReading();
    else if (isReading && isPaused) resumeReading();
    else startReading();
}

function chunkForFraction(f) {
    if (!chunks.length) return 0;
    const target = Math.max(0, Math.min(1, f)) * totalChars;
    for (let k = 0; k < chunks.length; k++) {
        if (target < chunkStarts[k] + chunks[k].length) return k;
    }
    return chunks.length - 1;
}

function seekToChunk(i, resume) {
    if (!prepareText()) return;
    i = Math.max(0, Math.min(chunks.length - 1, i));
    session++;
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    stopProgressLoop();
    chunkIndex = i; chunkOffset = 0; lastBoundary = 0;
    const abs = chunkStarts[i];
    setProgress(abs / totalChars); renderHighlight(abs);
    if (resume) {
        isReading = true; isPaused = false; updateUI();
        const token = session; const index = i;
        setTimeout(() => speakChunk(index, token), 60); requestWakeLock();
        // Ne reset pas le timer si on a déjà lu un peu
        if (parseInt($("pauseTimer").value) > 0 && !timerInterval) {
            startPauseTimer(false);
        }
    } else { updateUI(); }
}

function fractionFromEvent(e) {
    const r = bar.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
}

let dragging = false; let resumeAfterDrag = false;

bar.addEventListener("pointerdown", (e) => {
    if (!prepareText()) return;
    dragging = true; resumeAfterDrag = isReading && !isPaused;
    bar.classList.add("dragging");
    if (resumeAfterDrag) pauseReading();
    try { bar.setPointerCapture(e.pointerId); } catch (_) {}
    setProgress(fractionFromEvent(e));
});
bar.addEventListener("pointermove", (e) => { if (dragging) setProgress(fractionFromEvent(e)); });
bar.addEventListener("pointerup", (e) => {
    if (!dragging) return;
    dragging = false; bar.classList.remove("dragging");
    const f = fractionFromEvent(e);
    try { bar.releasePointerCapture(e.pointerId); } catch (_) {}
    seekToChunk(chunkForFraction(f), resumeAfterDrag);
});
bar.addEventListener("pointercancel", () => { dragging = false; bar.classList.remove("dragging"); });

function clearText() {
    session++;
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    stopProgressLoop();
    clearInterval(timerInterval); timerInterval = null; timerPausedTime = 0;
    if (isDictating) toggleDictation();
    isReading = false; isPaused = false;
    chunks = []; chunkStarts = []; totalChars = 0; chunkIndex = 0; chunkOffset = 0; lastBoundary = 0;
    preparedText = ""; estDuration = 0;
    textarea.value = ""; localStorage.removeItem('junior_savvy_autosave');
    clearHighlight(); setProgress(0); updateUI(); releaseWakeLock();
}

function updateLanguage() {
    document.documentElement.lang = language();
    $("subtitle").textContent = t("subtitle");
    $("languageLabel").textContent = t("languageLabel");
    $("voiceLabel").textContent = t("voiceLabel");
    $("timerLabel").textContent = t("timerLabel");
    $("speedLabel").textContent = t("speedLabel");
    $("pitchLabel").textContent = t("pitchLabel");
    $("textLabel").textContent = t("textLabel");
    if (recognition) recognition.lang = language() === "fr" ? "fr-FR" : "en-US";
    loadVoices(); updateUI();
}

playBtn.addEventListener("click", togglePlay);
dictateBtn.addEventListener("click", toggleDictation);
$("clearBtn").addEventListener("click", clearText);
$("language").addEventListener("change", updateLanguage);

let hasClearedWelcome = false;
textarea.addEventListener("focus", () => {
    if (!hasClearedWelcome && textarea.value.includes("Bienvenue sur JUNIOR SAVY")) {
        textarea.value = ""; hasClearedWelcome = true; preparedText = ""; setProgress(0);
    }
});

$("speed").addEventListener("input", () => {
    $("speedValue").textContent = Number($("speed").value).toFixed(1);
    if (!isReading && preparedText) {
        estDuration = estimateDuration(preparedText, Number($("speed").value));
        setProgress(progress);
    }
});
$("pitch").addEventListener("input", () => { $("pitchValue").textContent = Number($("pitch").value).toFixed(1); });

textarea.addEventListener("input", () => {
    if (isReading) return;
    preparedText = ""; chunks = []; chunkStarts = []; totalChars = 0;
    chunkIndex = 0; chunkOffset = 0; estDuration = 0;
    clearHighlight(); setProgress(0); updateUI(); autoSave();
});

if ("speechSynthesis" in window) { speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }

updateLanguage(); setProgress(0); loadAutoSave();

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(error => console.error("SW Error:", error));
    });
}
</script>
