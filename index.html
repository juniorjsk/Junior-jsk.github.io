<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<meta name="description" content="JUNIOR SAVY, ton assistant de lecture vocale.">
<link rel="manifest" href="./manifest.json">
<title>JUNIOR SAVY</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 15px;
    background: #0b1220;
    color: white;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 650px;
    margin: auto;
}

header {
    text-align: center;
    padding: 20px 10px;
}

/* Icône animée de l'assistante vocale */
.assistant-avatar {
    position: relative;
    width: 70px;
    height: 70px;
    margin: 0 auto 10px;
    background: #172337;
    border: 2px solid #7c3aed;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    box-shadow: 0 0 15px rgba(124, 58, 237, 0.4);
}

.assistant-avatar::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 2px solid #22c55e;
    animation: pulse 2s infinite;
    opacity: 0;
}

@keyframes pulse {
    0% { transform: scale(1); opacity: 0.8; }
    100% { transform: scale(1.35); opacity: 0; }
}

h1 {
    color: #22c55e;
    margin: 8px 0;
    font-size: 30px;
}

header p { color: #9ca3af; }

.panel {
    background: #172337;
    padding: 16px;
    border-radius: 16px;
    margin-bottom: 15px;
    border: 1px solid #293951;
}

label {
    display: block;
    margin: 12px 0 6px;
    color: #cbd5e1;
    font-size: 14px;
}

select, input, textarea {
    width: 100%;
    padding: 12px;
    background: #0b1220;
    border: 1px solid #37465e;
    border-radius: 10px;
    color: white;
    font-size: 15px;
}

input[type="range"] {
    padding: 5px 0;
    accent-color: #22c55e;
}

textarea {
    min-height: 150px;
    resize: vertical;
}

/* Boutons côte à côte sur toute la largeur */
.action-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

button {
    padding: 14px;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

button:active { transform: scale(.97); }

button:focus-visible {
    outline: 2px solid white;
    outline-offset: 3px;
}

.purple { background: #7c3aed; }
.red { background: #dc2626; }

.status {
    color: #4ade80;
    text-align: center;
    font-size: 13px;
    margin-top: 12px;
}

footer {
    text-align: center;
    color: #64748b;
    padding: 15px;
    font-size: 12px;
}

@media(max-width: 380px) {
    h1 { font-size: 25px; }
    button { font-size: 13px; padding: 12px; }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="assistant-avatar" title="Assistante Vocale JUNIOR SAVY">🎙️</div>
    <h1 id="titleText">JUNIOR SAVY</h1>
    <p id="subtitle">Ton assistant de lecture vocale</p>
</header>

<div class="panel">

    <label id="languageLabel">Langue</label>
    <select id="language">
        <option value="fr">Français</option>
        <option value="en">English</option>
    </select>

    <label id="voiceLabel">Voix disponible</label>
    <select id="voice"></select>

    <label id="speedLabel">Vitesse : <span id="speedValue">1</span></label>
    <input type="range" id="speed" min="0.5" max="2" step="0.1" value="1">

    <label id="pitchLabel">Tonalité : <span id="pitchValue">1</span></label>
    <input type="range" id="pitch" min="0.5" max="2" step="0.1" value="1">

</div>

<div class="panel">

    <label id="textLabel" for="textInput">Écris ou colle ton texte ici :</label>
    <textarea id="textInput" placeholder="Tape ton texte à lire à haute voix..."></textarea>

    <div class="action-buttons">
        <button class="purple" onclick="toggleReadPause()" id="readPauseButton">
            <span id="readIcon">🔊</span> <span id="readText">LIRE</span>
        </button>
        <button class="red" onclick="clearText()" id="clearButton">
            🗑️ <span id="clearTextLabel">EFFACER</span>
        </button>
    </div>

    <div class="status" id="status">● Prêt</div>

</div>

<footer>
    JUNIOR SAVY © 2026<br>
    Assistant personnel
</footer>

</div>

<script>
let voices = [];
let isReading = false;
let isPaused = false;

const $ = id => document.getElementById(id);

const translations = {
    fr: {
        subtitle: "Ton assistant de lecture vocale",
        languageLabel: "Langue",
        voiceLabel: "Voix disponible",
        speedLabel: "Vitesse : ",
        pitchLabel: "Tonalité : ",
        textLabel: "Écris ou colle ton texte ici :",
        placeholder: "Tape ton texte à lire à haute voix...",
        read: "LIRE",
        pause: "PAUSE",
        resume: "REPRENDRE",
        clear: "EFFACER",
        ready: "● Prêt",
        reading: "● Lecture en cours...",
        paused: "● En pause",
        empty: "Veuillez entrer du texte à lire.",
        noVoice: "Aucune voix disponible",
        speechNotSupported: "La synthèse vocale n'est pas supportée par votre navigateur."
    },
    en: {
        subtitle: "Your voice reading assistant",
        languageLabel: "Language",
        voiceLabel: "Available voice",
        speedLabel: "Speed : ",
        pitchLabel: "Pitch : ",
        textLabel: "Type or paste your text here:",
        placeholder: "Type text to read aloud...",
        read: "READ",
        pause: "PAUSE",
        resume: "RESUME",
        clear: "CLEAR",
        ready: "● Ready",
        reading: "● Reading...",
        paused: "● Paused",
        empty: "Please enter some text to read.",
        noVoice: "No voice available",
        speechNotSupported: "Speech synthesis is not supported by your browser."
    }
};

function language() {
    return $("language").value;
}

function t(key) {
    return translations[language()][key];
}

function loadVoices() {
    if (!("speechSynthesis" in window)) return;

    voices = speechSynthesis.getVoices();
    const selectedLanguage = language();
    const filtered = voices.filter(v => v.lang.toLowerCase().startsWith(selectedLanguage));

    $("voice").innerHTML = "";

    filtered.forEach(v => {
        const option = document.createElement("option");
        option.value = v.name;
        option.textContent = v.name + " (" + v.lang + ")";
        $("voice").appendChild(option);
    });

    if (filtered.length === 0) {
        const option = document.createElement("option");
        option.value = "";
        option.textContent = t("noVoice");
        $("voice").appendChild(option);
    }
}

function toggleReadPause() {
    if (!("speechSynthesis" in window)) {
        alert(t("speechNotSupported"));
        return;
    }

    const text = $("textInput").value.trim();

    // Si on est en train de lire -> Passer en pause
    if (isReading && !isPaused) {
        speechSynthesis.pause();
        isPaused = true;
        $("readIcon").textContent = "▶️";
        $("readText").textContent = t("resume");
        $("status").textContent = t("paused");
        return;
    }

    // Si on est en pause -> Reprendre la lecture
    if (isReading && isPaused) {
        speechSynthesis.resume();
        isPaused = false;
        $("readIcon").textContent = "⏸️";
        $("readText").textContent = t("pause");
        $("status").textContent = t("reading");
        return;
    }

    // Sinon, lancer une nouvelle lecture
    if (!text) {
        alert(t("empty"));
        return;
    }

    speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);
    const selected = $("voice").value;
    const voice = voices.find(v => v.name === selected);

    if (voice) {
        speech.voice = voice;
    }

    speech.lang = language() === "fr" ? "fr-FR" : "en-US";
    speech.rate = Number($("speed").value);
    speech.pitch = Number($("pitch").value);

    speech.onstart = () => {
        isReading = true;
        isPaused = false;
        $("readIcon").textContent = "⏸️";
        $("readText").textContent = t("pause");
        $("status").textContent = t("reading");
    };

    speech.onend = () => {
        resetReadState();
    };

    speech.onerror = () => {
        resetReadState();
    };

    speechSynthesis.speak(speech);
}

function resetReadState() {
    isReading = false;
    isPaused = false;
    $("readIcon").textContent = "🔊";
    $("readText").textContent = t("read");
    $("status").textContent = t("ready");
}

function clearText() {
    if ("speechSynthesis" in window) {
        speechSynthesis.cancel();
    }
    resetReadState();
    $("textInput").value = "";
}

function updateLanguage() {
    const en = language() === "en";

    $("subtitle").textContent = t("subtitle");
    $("languageLabel").textContent = t("languageLabel");
    $("voiceLabel").textContent = t("voiceLabel");
    $("speedLabel").innerHTML = t("speedLabel") + '<span id="speedValue">' + $("speed").value + '</span>';
    $("pitchLabel").innerHTML = t("pitchLabel") + '<span id="pitchValue">' + $("pitch").value + '</span>';
    $("textLabel").textContent = t("textLabel");
    $("textInput").placeholder = t("placeholder");
    $("clearTextLabel").textContent = t("clear");

    if (!isReading) {
        $("readText").textContent = t("read");
    } else if (isPaused) {
        $("readText").textContent = t("resume");
    } else {
        $("readText").textContent = t("pause");
    }

    $("status").textContent = t("ready");
    loadVoices();
}

$("language").addEventListener("change", () => {
    updateLanguage();
});

$("speed").addEventListener("input", () => {
    $("speedValue").textContent = $("speed").value;
});

$("pitch").addEventListener("input", () => {
    $("pitchValue").textContent = $("pitch").value;
});

if ("speechSynthesis" in window) {
    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();
}

updateLanguage();

// Enregistrement du Service Worker
if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(error => {
            console.error("Erreur Service Worker JUNIOR SAVY :", error);
        });
    });
}
</script>

</body>
</html>
